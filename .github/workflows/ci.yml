name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy pyarrow pytest ruff
      - name: Lint
        run: ruff check src/analytics src/maintenance tests
      - name: Unit tests
        run: pytest -q

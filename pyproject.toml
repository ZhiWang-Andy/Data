[project]
name = "cloud-ecommerce-analytics"
version = "0.1.0"
description = "Spark SQL, AWS, A/B testing, data quality, and BI portfolio project"
requires-python = ">=3.10,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["airflow/dags", "aws/glue", "src/etl"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
